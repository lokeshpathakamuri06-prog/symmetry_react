services:
  web:
    build: .
    # Host networking: binds 80/443 (+8080 redirect) and proxies /api to the API on 127.0.0.1:8000
    network_mode: host
    restart: unless-stopped
    volumes:
      - caddy_data:/data      # TLS certificates; must persist to avoid re-issuing on every deploy
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
